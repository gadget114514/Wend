<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase E - Advanced Decorators (Simple)</title>
    <style>
        body {
            font-family: monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            margin: 0;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #4ec9b0; border-bottom: 2px solid #4ec9b0; padding-bottom: 10px; }
        .test-item {
            margin: 10px 0;
            padding: 12px;
            border-radius: 3px;
            border-left: 4px solid;
        }
        .pass { background: #1e6b1e; border-color: #6a9955; color: #6a9955; }
        .fail { background: #6b1e1e; border-color: #f48771; color: #f48771; }
        .info { background: #1e3a6b; border-color: #9cdcfe; color: #9cdcfe; }
        button {
            background: #007acc;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
            font-size: 14px;
            margin: 10px 5px 10px 0;
        }
        button:hover { background: #005a9e; }
        .console-output {
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🚀 Phase E - Advanced Decorators (Simplified)</h1>
    <p>Testing MaxTime, Guard, Retry decorators</p>

    <div style="margin-top: 20px;">
        <button onclick="testMaxTime()">⏱️ MaxTime</button>
        <button onclick="testGuard()">🛡️ Guard</button>
        <button onclick="testRetry()">🔄 Retry</button>
        <button onclick="clearConsole()">🗑 Clear</button>
    </div>

    <h2>Test Output</h2>
    <div class="console-output" id="console-output"></div>
</div>

<script src="b3-shim.js"></script>
<script src="bt-b3-node-registry.js"></script>
<script src="bt-b3-decorators.js"></script>

<script>
const outputDiv = document.getElementById('console-output');

function log(message) {
    const line = document.createElement('div');
    line.className = 'test-item info';

    if (message.includes('✅')) line.className = 'test-item pass';
    if (message.includes('❌')) line.className = 'test-item fail';

    line.textContent = message;
    outputDiv.appendChild(line);
    outputDiv.scrollTop = outputDiv.scrollHeight;
    console.log(message);
}

function clearConsole() {
    outputDiv.innerHTML = '';
}

// Test MaxTime Decorator
function testMaxTime() {
    clearConsole();
    log('⏱️ Testing MaxTime Decorator...\n');

    try {
        class SlowAction extends b3.Action {
            constructor(properties = {}) {
                super(properties);
                this.duration = properties.duration || 2000;
                this._startTime = null;
            }

            tick(blackboard) {
                if (!this._startTime) {
                    this._startTime = Date.now();
                    return b3.Status.RUNNING;
                }

                const elapsed = Date.now() - this._startTime;
                if (elapsed < this.duration) {
                    return b3.Status.RUNNING;
                }

                this._startTime = null;
                return b3.Status.SUCCESS;
            }
        }

        const timeout = new MaxTime({ maxTime: 100 });
        const slowChild = new SlowAction({ duration: 500 });
        timeout.child = slowChild;
        const bb = new b3.Blackboard();

        let status = timeout.tick(bb);
        if (status === b3.Status.RUNNING) {
            log('✅ MaxTime starts child');
        } else {
            log('❌ MaxTime should return RUNNING on first tick');
            return;
        }

        setTimeout(() => {
            const result = timeout.tick(bb);
            if (result === b3.Status.FAILURE) {
                log('✅ MaxTime timeout works');
            } else {
                log('❌ MaxTime should return FAILURE on timeout');
            }
        }, 150);

    } catch (e) {
        log(`❌ MaxTime test failed: ${e.message}`);
    }
}

// Test Guard Decorator
function testGuard() {
    clearConsole();
    log('🛡️ Testing Guard Decorator...\n');

    try {
        class SimpleAction extends b3.Action {
            tick(blackboard) {
                return b3.Status.SUCCESS;
            }
        }

        const guard = new Guard({
            condition: 'allowed',
            expectedValue: true
        });
        const child = new SimpleAction();
        guard.child = child;
        const bb = new b3.Blackboard();

        // Test: Guard blocks when condition not met
        let status = guard.tick(bb);
        if (status === b3.Status.FAILURE) {
            log('✅ Guard blocks when condition not met');
        } else {
            log('❌ Guard should fail when condition not met');
            return;
        }

        // Test: Guard allows when condition met
        bb.set('allowed', true);
        status = guard.tick(bb);
        if (status === b3.Status.SUCCESS) {
            log('✅ Guard allows when condition met');
        } else {
            log('❌ Guard should succeed when condition met');
            return;
        }

        log('\n✅ All Guard tests passed!');

    } catch (e) {
        log(`❌ Guard test failed: ${e.message}`);
    }
}

// Test Retry Decorator
function testRetry() {
    clearConsole();
    log('🔄 Testing Retry Decorator...\n');

    try {
        let attemptCount = 0;

        class FailThenSuccess extends b3.Action {
            tick(blackboard) {
                attemptCount++;
                if (attemptCount < 2) {
                    return b3.Status.FAILURE;
                }
                return b3.Status.SUCCESS;
            }
        }

        const retry = new Retry({ maxRetries: 2 });
        const child = new FailThenSuccess();
        retry.child = child;
        const bb = new b3.Blackboard();

        let status = retry.tick(bb);
        if (status === b3.Status.RUNNING) {
            log('✅ Retry returns RUNNING after failure');
        } else {
            log('❌ Retry should return RUNNING on first failure');
            return;
        }

        status = retry.tick(bb);
        if (status === b3.Status.SUCCESS) {
            log('✅ Retry succeeds after retry');
        } else {
            log('❌ Retry should succeed on retry');
            return;
        }

        if (attemptCount === 2) {
            log('✅ Retry used 2 attempts');
        } else {
            log(`❌ Expected 2 attempts, got ${attemptCount}`);
            return;
        }

        log('\n✅ All Retry tests passed!');

    } catch (e) {
        log(`❌ Retry test failed: ${e.message}`);
    }
}
</script>

</body>
</html>
