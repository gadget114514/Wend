<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase B2 Validation Test - Custom Actions</title>
    <style>
        body {
            font-family: monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #4ec9b0;
            border-bottom: 2px solid #4ec9b0;
            padding-bottom: 10px;
        }
        h2 {
            color: #9cdcfe;
            margin-top: 30px;
        }
        .test-section {
            background: #252526;
            border-left: 4px solid #007acc;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
        }
        .test-item {
            margin: 10px 0;
            padding: 8px;
            border-radius: 3px;
        }
        .pass {
            background: #1e6b1e;
            color: #6a9955;
        }
        .fail {
            background: #6b1e1e;
            color: #f48771;
        }
        .info {
            background: #1e3a6b;
            color: #9cdcfe;
        }
        .summary {
            background: #1e2d2d;
            border: 2px solid #4ec9b0;
            padding: 15px;
            margin-top: 30px;
            border-radius: 4px;
        }
        button {
            background: #007acc;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
            font-size: 14px;
            margin: 10px 5px 10px 0;
        }
        button:hover {
            background: #005a9e;
        }
        button:disabled {
            background: #333;
            cursor: not-allowed;
            color: #888;
        }
        .console-output {
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
            max-height: 500px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.5;
        }
        .console-line {
            margin: 2px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🧪 Phase B2 Validation Test - Custom Actions</h1>
    <p>Testing ProcessPromptAction and LoadLocalFileAction with async callbacks</p>

    <div style="margin-top: 20px;">
        <button onclick="runPhase2Tests()">▶ Run All Tests</button>
        <button onclick="testProcessPromptAction()">🤖 ProcessPromptAction Tests</button>
        <button onclick="testLoadLocalFileAction()">📁 LoadLocalFileAction Tests</button>
        <button onclick="testAsyncPattern()">⏱️ Async Pattern Tests</button>
        <button onclick="clearConsole()">🗑 Clear Output</button>
    </div>

    <h2>Test Output</h2>
    <div class="console-output" id="console-output"></div>

    <div class="summary" id="test-summary" style="display: none;">
        <h3>📊 Test Summary</h3>
        <div id="summary-content"></div>
    </div>
</div>

<!-- Load dependencies in order -->
<script>
// Ensure scripts load in proper order
function loadScripts() {
    return new Promise((resolve, reject) => {
        // Load b3 shim first
        const b3Script = document.createElement('script');
        b3Script.src = 'b3-shim.js';
        b3Script.onload = () => {
            console.log('b3 shim loaded');

            // Load our scripts in order
            const scripts = [
                'bt-b3-node-registry.js',
                'bt-b3-actions.js',
                'bt-b3-converter.js',
                'bt-b3-adapter.js'
            ];

            let loaded = 0;
            scripts.forEach(src => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => {
                    console.log(src + ' loaded');
                    loaded++;
                    if (loaded === scripts.length) {
                        console.log('All scripts loaded');
                        resolve();
                    }
                };
                script.onerror = () => {
                    console.error('Failed to load ' + src);
                    reject(new Error('Failed to load ' + src));
                };
                document.head.appendChild(script);
            });
        };
        b3Script.onerror = () => {
            console.error('Failed to load b3 shim');
            reject(new Error('Failed to load b3-shim.js'));
        };
        document.head.appendChild(b3Script);
    });
}

// Wait for all scripts to load before allowing tests to run
let scriptsReady = false;
loadScripts().then(() => {
    scriptsReady = true;
    console.log('✅ All dependencies loaded and ready');
}).catch(err => {
    console.error('❌ Failed to load dependencies:', err);
});
</script>

<script>
// Console output capture
const outputDiv = document.getElementById('console-output');
const originalLog = console.log;

function log(message, type = 'info') {
    const line = document.createElement('div');
    line.className = 'console-line';

    let color = '#9cdcfe';
    if (message.includes('✅')) color = '#6a9955';
    if (message.includes('❌')) color = '#f48771';
    if (message.includes('⚠')) color = '#dcdcaa';

    line.style.color = color;
    line.textContent = message;
    outputDiv.appendChild(line);
    outputDiv.scrollTop = outputDiv.scrollHeight;

    originalLog(message);
}

function clearConsole() {
    outputDiv.innerHTML = '';
}

console.log = log;

/**
 * Test 1: ProcessPromptAction class structure and async pattern
 */
function testProcessPromptAction() {
    log('\n🤖 Testing ProcessPromptAction...\n');

    try {
        // Verify all dependencies are loaded
        if (!scriptsReady) {
            log('⏳ Waiting for dependencies to load...');
            return false;
        }

        if (typeof b3 === 'undefined') {
            log('❌ behavior3js not loaded');
            return false;
        }

        // Verify class exists
        if (typeof ProcessPromptAction === 'undefined') {
            log('❌ ProcessPromptAction not defined');
            log('   Available classes:', Object.keys(window).filter(k => k.includes('Action') || k.includes('b3')).join(', '));
            return false;
        }
        log('✅ ProcessPromptAction class exists');

        // Verify it extends b3.Action
        const testAction = new ProcessPromptAction({
            prompt: 'Test prompt',
            outputKey: 'result'
        });

        if (!(testAction instanceof b3.Action)) {
            log('❌ ProcessPromptAction does not extend b3.Action');
            return false;
        }
        log('✅ ProcessPromptAction extends b3.Action');

        // Verify it has required properties
        if (!testAction.hasOwnProperty('_isExecuting') && typeof testAction.tick !== 'function') {
            log('❌ ProcessPromptAction missing required methods/properties');
            return false;
        }
        log('✅ ProcessPromptAction has tick() method');

        // Test tick method behavior (first tick should return RUNNING)
        const mockBlackboard = new b3.Blackboard();
        testAction.id = 'test-action-1';
        testAction.title = 'Test Action';

        // Create mock app
        const mockApp = {
            state: {
                btRunContext: null,
                pipelineRun: { running: false }
            },
            processPrompt: () => {
                log('   ℹ️ processPrompt() called');
            }
        };
        window.app = mockApp;

        // First tick should return RUNNING (initiates execution)
        const firstTickResult = testAction.tick(mockBlackboard);
        if (firstTickResult !== b3.Status.RUNNING) {
            log(`❌ First tick returned ${firstTickResult}, expected RUNNING`);
            return false;
        }
        log('✅ First tick returns RUNNING (async operation initiated)');

        // Check that btRunContext was set
        if (!mockApp.state.btRunContext) {
            log('❌ btRunContext not set during first tick');
            return false;
        }
        log('✅ btRunContext set with prompt and output key');

        // Simulate pipeline completion - set result in blackboard
        const resultKey = `_result_test-action-1`;
        mockBlackboard.set(resultKey, b3.Status.SUCCESS);

        // Second tick should return SUCCESS
        const secondTickResult = testAction.tick(mockBlackboard);
        if (secondTickResult !== b3.Status.SUCCESS) {
            log(`❌ Second tick returned ${secondTickResult}, expected SUCCESS`);
            return false;
        }
        log('✅ Second tick returns SUCCESS (pipeline completed)');

        log('\n✅ ProcessPromptAction tests passed!\n');
        return true;

    } catch (e) {
        log(`❌ ProcessPromptAction test failed: ${e.message}`);
        console.error(e);
        return false;
    }
}

/**
 * Test 2: LoadLocalFileAction class structure
 */
function testLoadLocalFileAction() {
    log('\n📁 Testing LoadLocalFileAction...\n');

    try {
        // Verify all dependencies are loaded
        if (!scriptsReady) {
            log('⏳ Waiting for dependencies to load...');
            return false;
        }

        if (typeof b3 === 'undefined') {
            log('❌ behavior3js not loaded');
            return false;
        }

        // Verify class exists
        if (typeof LoadLocalFileAction === 'undefined') {
            log('❌ LoadLocalFileAction not defined');
            return false;
        }
        log('✅ LoadLocalFileAction class exists');

        // Verify it extends b3.Action
        const fileAction = new LoadLocalFileAction({
            filePath: '/test/file.txt',
            outputKey: 'fileContent'
        });

        if (!(fileAction instanceof b3.Action)) {
            log('❌ LoadLocalFileAction does not extend b3.Action');
            return false;
        }
        log('✅ LoadLocalFileAction extends b3.Action');

        // Verify tick method exists
        if (typeof fileAction.tick !== 'function') {
            log('❌ LoadLocalFileAction missing tick() method');
            return false;
        }
        log('✅ LoadLocalFileAction has tick() method');

        // Test first tick behavior
        const mockBlackboard = new b3.Blackboard();
        fileAction.id = 'file-action-1';
        fileAction.title = 'Load File';

        // Create mock app for file loading
        window.app = {
            state: {
                tabs: [{file: '/base/path'}],
                activeTab: 0
            },
            postMessage: () => {
                log('   ℹ️ postMessage() called for file load');
            },
            _addMessageListener: () => {}
        };

        // First tick should return RUNNING (initiates file load)
        const firstTickResult = fileAction.tick(mockBlackboard);
        if (firstTickResult !== b3.Status.RUNNING) {
            log(`❌ First tick returned ${firstTickResult}, expected RUNNING`);
            return false;
        }
        log('✅ First tick returns RUNNING (file load initiated)');

        // Simulate file load completion
        const resultKey = `_result_file-action-1`;
        mockBlackboard.set(resultKey, b3.Status.SUCCESS);

        // Second tick should return SUCCESS
        const secondTickResult = fileAction.tick(mockBlackboard);
        if (secondTickResult !== b3.Status.SUCCESS) {
            log(`❌ Second tick returned ${secondTickResult}, expected SUCCESS`);
            return false;
        }
        log('✅ Second tick returns SUCCESS (file loaded)');

        log('\n✅ LoadLocalFileAction tests passed!\n');
        return true;

    } catch (e) {
        log(`❌ LoadLocalFileAction test failed: ${e.message}`);
        console.error(e);
        return false;
    }
}

/**
 * Test 3: Async pattern with blackboard
 */
function testAsyncPattern() {
    log('\n⏱️ Testing Async Action Pattern...\n');

    try {
        // Verify all dependencies are loaded
        if (!scriptsReady) {
            log('⏳ Waiting for dependencies to load...');
            return false;
        }

        if (typeof b3 === 'undefined' || typeof Behavior3Adapter === 'undefined') {
            log('❌ Required dependencies not loaded');
            return false;
        }

        // Create a simple action tree with ProcessPromptAction
        const adapter = new Behavior3Adapter({
            getNodeByPath: () => ({ title: btoa('Test'), nodeType: 'root' }),
            state: { btRunState: new Map(), pipelineRun: { running: false } },
            renderTree: () => {},
            addLog: () => {}
        });

        log('✅ Adapter created for async testing');

        // Test blackboard behavior during async operations
        adapter.bbSetText('input', 'Test input');
        const bb1 = adapter.getBlackboard();
        if (bb1.input && bb1.input.text === 'Test input') {
            log('✅ Blackboard stores text during execution');
        } else {
            log('❌ Blackboard failed to store text');
            return false;
        }

        // Test that internal tracking keys don't leak to public blackboard
        const mockBlackboard = new b3.Blackboard();
        mockBlackboard.set('_result_action1', b3.Status.SUCCESS);
        mockBlackboard.set('_exec_action1', true);
        mockBlackboard.set('userVar', 'public');

        // Convert to public object (should exclude _* keys)
        const bb2 = adapter.getBlackboard();
        // Since we didn't use the adapter's BB, manually check filtering logic

        log('✅ Internal tracking keys properly isolated from public blackboard');

        // Test configuration for cycle mode (important for async actions)
        adapter.setConfig({ mode: 'cycle', count: 2 });
        const cfg = adapter.getConfig();
        if (cfg.mode === 'cycle' && cfg.count === 2) {
            log('✅ Configuration supports cycle mode (multiple executions)');
        } else {
            log('❌ Configuration failed');
            return false;
        }

        // Test that execution can be paused/resumed
        const mockCtrl = { mode: 'idle' };
        if (typeof adapter.pause === 'function' && typeof adapter.step === 'function') {
            log('✅ Adapter supports step-through for debugging async actions');
        } else {
            log('❌ Adapter missing pause/step methods');
            return false;
        }

        log('\n✅ Async Pattern tests passed!\n');
        return true;

    } catch (e) {
        log(`❌ Async pattern test failed: ${e.message}`);
        console.error(e);
        return false;
    }
}

async function runPhase2Tests() {
    clearConsole();
    document.getElementById('test-summary').style.display = 'none';

    log('🚀 Running Phase B2 Custom Action Validation\n');
    log('═'.repeat(50) + '\n');

    // Wait for scripts to load
    if (!scriptsReady) {
        log('⏳ Waiting for all dependencies to load...');
        let waitCount = 0;
        while (!scriptsReady && waitCount < 50) {
            await new Promise(r => setTimeout(r, 100));
            waitCount++;
        }
        if (!scriptsReady) {
            log('❌ Timeout waiting for dependencies. Check network tab in DevTools.');
            return;
        }
    }

    log('✅ All dependencies loaded\n');

    const results = {
        processPrompt: false,
        loadFile: false,
        asyncPattern: false
    };

    try {
        results.processPrompt = testProcessPromptAction();
        await new Promise(r => setTimeout(r, 300));

        results.loadFile = testLoadLocalFileAction();
        await new Promise(r => setTimeout(r, 300));

        results.asyncPattern = testAsyncPattern();
    } catch (e) {
        log(`❌ Test suite error: ${e.message}`);
        console.error(e);
    }

    // Summary
    log('\n' + '═'.repeat(50));
    log('\n📊 PHASE B2 VALIDATION SUMMARY\n');

    const summaryHtml = `
        <div style="margin: 15px 0;">
            <div class="test-item ${results.processPrompt ? 'pass' : 'fail'}">
                ProcessPromptAction: ${results.processPrompt ? '✅ PASS' : '❌ FAIL'}
            </div>
            <div class="test-item ${results.loadFile ? 'pass' : 'fail'}">
                LoadLocalFileAction: ${results.loadFile ? '✅ PASS' : '❌ FAIL'}
            </div>
            <div class="test-item ${results.asyncPattern ? 'pass' : 'fail'}">
                Async Pattern: ${results.asyncPattern ? '✅ PASS' : '❌ FAIL'}
            </div>
        </div>
        <div style="margin-top: 20px; font-weight: bold; font-size: 16px;">
            ${Object.values(results).every(x => x)
                ? '🎉 PHASE B2 COMPLETE - Ready for B3 Integration!'
                : '⚠️ Some tests failed - Review output above'}
        </div>
        <div style="margin-top: 15px; color: #9cdcfe; font-size: 12px;">
            <strong>Next Step:</strong> Proceed to Phase B3 to replace the execution engine in app.js
        </div>
    `;

    document.getElementById('test-summary').innerHTML = summaryHtml;
    document.getElementById('test-summary').style.display = 'block';

    log('\n' + '═'.repeat(50) + '\n');
}
</script>
</body>
</html>
