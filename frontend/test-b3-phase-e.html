<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase E - Advanced Decorators</title>
    <style>
        body {
            font-family: monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            margin: 0;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #4ec9b0; border-bottom: 2px solid #4ec9b0; padding-bottom: 10px; }
        h2 { color: #9cdcfe; margin-top: 30px; }
        .test-item {
            margin: 10px 0;
            padding: 12px;
            border-radius: 3px;
            border-left: 4px solid;
        }
        .pass { background: #1e6b1e; border-color: #6a9955; color: #6a9955; }
        .fail { background: #6b1e1e; border-color: #f48771; color: #f48771; }
        .info { background: #1e3a6b; border-color: #9cdcfe; color: #9cdcfe; }
        .summary {
            background: #1e2d2d;
            border: 2px solid #4ec9b0;
            padding: 15px;
            margin-top: 30px;
            border-radius: 4px;
        }
        button {
            background: #007acc;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
            font-size: 14px;
            margin: 10px 5px 10px 0;
        }
        button:hover { background: #005a9e; }
        .console-output {
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🚀 Phase E - Advanced Decorators</h1>
    <p>Testing MaxTime, Guard, Retry, Delay, and Limiter decorators</p>

    <div style="margin-top: 20px;">
        <button onclick="runPhaseETests()">▶ Run All Phase E Tests</button>
        <button onclick="testMaxTime()">⏱️ MaxTime Decorator</button>
        <button onclick="testGuard()">🛡️ Guard Decorator</button>
        <button onclick="testRetry()">🔄 Retry Decorator</button>
        <button onclick="testDelay()">⏳ Delay Decorator</button>
        <button onclick="testLimiter()">🚫 Limiter Decorator</button>
        <button onclick="clearConsole()">🗑 Clear Output</button>
    </div>

    <h2>Test Output</h2>
    <div class="console-output" id="console-output"></div>

    <div class="summary" id="test-summary" style="display: none;">
        <h3>📊 Phase E Test Summary</h3>
        <div id="summary-content"></div>
    </div>
</div>

<!-- Load dependencies -->
<script src="b3-shim.js"></script>
<script src="bt-b3-node-registry.js"></script>
<script src="bt-b3-decorators.js"></script>

<script>
const outputDiv = document.getElementById('console-output');

function log(message) {
    const line = document.createElement('div');
    line.className = 'test-item info';

    if (message.includes('✅')) line.className = 'test-item pass';
    if (message.includes('❌')) line.className = 'test-item fail';

    line.textContent = message;
    outputDiv.appendChild(line);
    outputDiv.scrollTop = outputDiv.scrollHeight;
    console.log(message);
}

function clearConsole() {
    outputDiv.innerHTML = '';
}

console.log = log;

/**
 * Test 1: MaxTime Decorator
 */
function testMaxTime() {
    log('\n⏱️ Testing MaxTime Decorator...\n');

    try {
        // Create a simple child node that runs for a while
        class SlowAction extends b3.Action {
            constructor(properties = {}) {
                super(properties);
                this.duration = properties.duration || 2000;
                this._startTime = null;
            }

            tick(blackboard) {
                if (!this._startTime) {
                    this._startTime = Date.now();
                    return b3.Status.RUNNING;
                }

                const elapsed = Date.now() - this._startTime;
                if (elapsed < this.duration) {
                    return b3.Status.RUNNING;
                }

                this._startTime = null;
                return b3.Status.SUCCESS;
            }
        }

        // Test immediate timeout
        const timeout = new MaxTime({ maxTime: 100 });
        const slowChild = new SlowAction({ duration: 500 });
        timeout.child = slowChild;
        const bb = new b3.Blackboard();

        // First tick
        let status = timeout.tick(bb);
        if (status === b3.Status.RUNNING) {
            log('✅ MaxTime starts child');
        } else {
            log('❌ MaxTime should return RUNNING on first tick');
            return false;
        }

        // Simulate timeout
        setTimeout(() => {
            const result = timeout.tick(bb);
            if (result === b3.Status.FAILURE) {
                log('✅ MaxTime timeout works (aborts after duration)');
            } else {
                log('❌ MaxTime should return FAILURE on timeout');
            }
        }, 150);

        return true;

    } catch (e) {
        log(`❌ MaxTime test failed: ${e.message}`);
        console.error(e);
        return false;
    }
}

/**
 * Test 2: Guard Decorator
 */
function testGuard() {
    log('\n🛡️ Testing Guard Decorator...\n');

    try {
        class SimpleAction extends b3.Action {
            tick(blackboard) {
                return b3.Status.SUCCESS;
            }
        }

        const guard = new Guard({
            condition: 'allowed',
            expectedValue: true
        });
        const child = new SimpleAction();
        guard.child = child;
        const bb = new b3.Blackboard();

        // Test 1: Guard blocks when condition not met
        let status = guard.tick(bb);
        if (status === b3.Status.FAILURE) {
            log('✅ Guard blocks when condition not met');
        } else {
            log('❌ Guard should fail when condition not met');
            return false;
        }

        // Test 2: Guard allows when condition met
        bb.set('allowed', true);
        status = guard.tick(bb);
        if (status === b3.Status.SUCCESS) {
            log('✅ Guard allows when condition met');
        } else {
            log('❌ Guard should succeed when condition met');
            return false;
        }

        // Test 3: Guard with negation
        const negatedGuard = new Guard({
            condition: 'blocked',
            negate: true
        });
        negatedGuard.child = child;
        const bb2 = new b3.Blackboard();
        bb2.set('blocked', false); // Negated: false → true

        status = negatedGuard.tick(bb2);
        if (status === b3.Status.SUCCESS) {
            log('✅ Guard negation works');
        } else {
            log('❌ Guard negation failed');
            return false;
        }

        log('\n✅ Guard tests passed!\n');
        return true;

    } catch (e) {
        log(`❌ Guard test failed: ${e.message}`);
        console.error(e);
        return false;
    }
}

/**
 * Test 3: Retry Decorator
 */
function testRetry() {
    log('\n🔄 Testing Retry Decorator...\n');

    try {
        let attemptCount = 0;

        class FailThenSuccess extends b3.Action {
            tick(blackboard) {
                attemptCount++;
                if (attemptCount < 2) {
                    return b3.Status.FAILURE; // Fail first time
                }
                return b3.Status.SUCCESS; // Succeed second time
            }
        }

        const retry = new Retry({ maxRetries: 2 });
        const child = new FailThenSuccess();
        retry.child = child;
        const bb = new b3.Blackboard();

        // First tick - child fails
        let status = retry.tick(bb);
        if (status === b3.Status.RUNNING) {
            log('✅ Retry returns RUNNING after failure');
        } else {
            log('❌ Retry should return RUNNING on first failure');
            return false;
        }

        // Second tick - child succeeds
        status = retry.tick(bb);
        if (status === b3.Status.SUCCESS) {
            log('✅ Retry succeeds after retry');
        } else {
            log('❌ Retry should succeed on retry');
            return false;
        }

        if (attemptCount === 2) {
            log('✅ Retry used 2 attempts (1 original + 1 retry)');
        } else {
            log(`❌ Expected 2 attempts, got ${attemptCount}`);
            return false;
        }

        log('\n✅ Retry tests passed!\n');
        return true;

    } catch (e) {
        log(`❌ Retry test failed: ${e.message}`);
        console.error(e);
        return false;
    }
}

/**
 * Test 4: Delay Decorator
 */
function testDelay() {
    log('\n⏳ Testing Delay Decorator...\n');

    try {
        class SimpleSuccess extends b3.Action {
            tick(blackboard) {
                return b3.Status.SUCCESS;
            }
        }

        const delayNode = new Delay({ delay: 100 });
        const child = new SimpleSuccess();
        delayNode.child = child;
        const bb = new b3.Blackboard();

        // Tick 1: starts delay
        let status = delayNode.tick(bb);
        if (status === b3.Status.RUNNING) {
            log('✅ Delay starts and returns RUNNING');
        } else {
            log('❌ Delay should return RUNNING on first tick');
            return false;
        }

        // Tick 2: immediately after, should still be RUNNING
        status = delayNode.tick(bb);
        if (status === b3.Status.RUNNING) {
            log('✅ Delay stays RUNNING before duration expires');
        } else {
            log('❌ Delay should stay RUNNING');
            return false;
        }

        // Wait 150ms and tick again
        setTimeout(() => {
            const statusAfter = delayNode.tick(bb);
            if (statusAfter === b3.Status.SUCCESS) {
                log('✅ Delay executes child and returns SUCCESS after delay expires');
            } else {
                log('❌ Delay should return SUCCESS after delay expires, got: ' + statusAfter);
            }
        }, 150);

        return true;
    } catch (e) {
        log(`❌ Delay test failed: ${e.message}`);
        console.error(e);
        return false;
    }
}

/**
 * Test 5: Limiter Decorator
 */
function testLimiter() {
    log('\n🚫 Testing Limiter Decorator...\n');

    try {
        class RunningAction extends b3.Action {
            tick(blackboard) {
                return b3.Status.RUNNING;
            }
        }

        const limiterNode = new Limiter({ maxConcurrent: 1 });
        const child = new RunningAction();
        limiterNode.child = child;
        const bb = new b3.Blackboard();

        // Tick 1: running count is 0, so child runs and returns RUNNING, count becomes 1
        let status = limiterNode.tick(bb);
        if (status === b3.Status.RUNNING) {
            log('✅ Limiter allows first run');
        } else {
            log('❌ Limiter should allow first run');
            return false;
        }

        // Tick 2: running count is 1, which equals maxConcurrent (1), so it fails
        status = limiterNode.tick(bb);
        if (status === b3.Status.FAILURE) {
            log('✅ Limiter blocks subsequent runs when limit reached');
        } else {
            log('❌ Limiter should block subsequent runs');
            return false;
        }

        log('\n✅ Limiter tests passed!\n');
        return true;
    } catch (e) {
        log(`❌ Limiter test failed: ${e.message}`);
        console.error(e);
        return false;
    }
}

async function runPhaseETests() {
    clearConsole();
    document.getElementById('test-summary').style.display = 'none';

    log('🚀 Running Phase E Advanced Decorator Tests\n');
    log('═'.repeat(50) + '\n');

    const results = {
        maxTime: false,
        guard: false,
        retry: false,
        delay: false,
        limiter: false
    };

    try {
        results.guard = testGuard();
        await new Promise(r => setTimeout(r, 100));

        results.retry = testRetry();
        await new Promise(r => setTimeout(r, 100));

        results.delay = testDelay();
        await new Promise(r => setTimeout(r, 100));

        results.limiter = testLimiter();
        await new Promise(r => setTimeout(r, 100));

        // MaxTime test includes async behavior
        const maxTimeResult = testMaxTime();
        results.maxTime = maxTimeResult;
        await new Promise(r => setTimeout(r, 500)); // Wait for MaxTime async test

    } catch (e) {
        log(`❌ Test suite error: ${e.message}`);
    }

    // Summary
    log('═'.repeat(50));
    log('\n📊 PHASE E ADVANCED DECORATORS TEST SUMMARY\n');

    const summaryHtml = `
        <div style="margin: 15px 0;">
            <div class="test-item ${results.maxTime ? 'pass' : 'fail'}">
                MaxTime Decorator: ${results.maxTime ? '✅ PASS' : '⏳ Async'}
            </div>
            <div class="test-item ${results.guard ? 'pass' : 'fail'}">
                Guard Decorator: ${results.guard ? '✅ PASS' : '❌ FAIL'}
            </div>
            <div class="test-item ${results.retry ? 'pass' : 'fail'}">
                Retry Decorator: ${results.retry ? '✅ PASS' : '❌ FAIL'}
            </div>
            <div class="test-item ${results.delay ? 'pass' : 'fail'}">
                Delay Decorator: ${results.delay ? '✅ PASS' : '❌ FAIL'}
            </div>
            <div class="test-item ${results.limiter ? 'pass' : 'fail'}">
                Limiter Decorator: ${results.limiter ? '✅ PASS' : '❌ FAIL'}
            </div>
        </div>
        <div style="margin-top: 20px; font-weight: bold; font-size: 16px;">
            ${results.guard && results.retry && results.delay && results.limiter ? '🎉 PHASE E ADVANCED DECORATORS VALIDATED!' : '⚠️ Some tests need review'}
        </div>
        <div style="margin-top: 15px; color: #9cdcfe; font-size: 12px;">
            <strong>Status:</strong> Advanced decorators ready for production
        </div>
    `;

    document.getElementById('test-summary').innerHTML = summaryHtml;
    document.getElementById('test-summary').style.display = 'block';

    log('═'.repeat(50) + '\n');
}
</script>
</body>
</html>
